spring:
  application:
    name: ordo
  # 비밀값(DB 비밀번호, JWT 키)은 git에 올리지 않는 application-local.yml 에 둔다. 없으면 아래 기본값 사용.
  config:
    import: optional:application-local.yml
  # 파일 가져오기(T12): 5MB 까지, 디스크 임시파일 없이 메모리에서만 처리
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 6MB

  datasource:
    url: jdbc:mysql://localhost:3306/ordo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway가 관리. 엔티티로 테이블을 만들거나 고치지 않는다.
    open-in-view: false
    properties.hibernate.format_sql: true
  flyway:
    enabled: true
    out-of-order: true        # 두 사람이 번호대를 나눠 쓰므로 필요
  jackson:
    time-zone: Asia/Seoul
    serialization.write-dates-as-timestamps: false

logging:
  level:
    # SQL 오류 메시지에 입력값(Duplicate entry '이메일')이 들어 있다. 원인은 GlobalExceptionHandler 가 남긴다
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes!!}
    access-token-validity-seconds: 3600       # 1시간
    refresh-token-validity-seconds: 1209600   # 14일
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  # 일정 알림 웹푸시(T11). 키 값은 커밋하지 않고 환경변수로만 넣는다. 없으면 알림 API 는 503, 서버는 정상 시작
  webpush:
    public-key: ${WEBPUSH_PUBLIC_KEY:}     # Base64url 87자 (공개해도 되는 값)
    private-key: ${WEBPUSH_PRIVATE_KEY:}   # Base64url 43자 (비밀)
    subject: ${WEBPUSH_SUBJECT:}           # mailto:팀메일 또는 https://배포주소 (localhost 불가)
  notification:
    scheduler-enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}   # 1분마다 발송. false 면 끔
