spring:
  application:
    name: ordo

  # ── MySQL 연결 ──────────────────────────────────────────────
  # createDatabaseIfNotExist=true  : ordo DB가 없으면 자동 생성
  # characterEncoding=UTF-8 + utf8mb4 : 한글/이모지 안 깨지게
  datasource:
    url: jdbc:mysql://localhost:3306/ordo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD:1234}   # ← 설치 때 정한 root 비밀번호로 바꾸세요 (또는 환경변수 DB_PASSWORD)
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # 엔티티로 테이블 자동 생성/수정 (초기 개발용)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  # Flyway는 2단계(스키마 확정)에서 켭니다. 지금은 ddl-auto로 개발.
  flyway:
    enabled: false

server:
  port: 8080
